services:
  postgres:
    image: postgres:16-alpine
    container_name: smartadvisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartadvisor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartadvisor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartadvisor} -d ${POSTGRES_DB:-smartadvisor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartadvisor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: smartadvisor-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartadvisor}:${POSTGRES_PASSWORD:-smartadvisor_secret}@postgres:5432/${POSTGRES_DB:-smartadvisor_db}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-smartadvisor-compose-local-jwt-secret-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
      CSRF_ENFORCE: ${CSRF_ENFORCE:-false}
      DEMO_DEFAULT_PASSWORD: ${DEMO_DEFAULT_PASSWORD:-SmartAdvisor2025!}
      CURRENT_SEMESTER: ${CURRENT_SEMESTER:-Spring 2025}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rds-worker:
    build:
      context: ../services/rds-worker
      dockerfile: Dockerfile
    container_name: smartadvisor-rds-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartadvisor}:${POSTGRES_PASSWORD:-smartadvisor_secret}@postgres:5432/${POSTGRES_DB:-smartadvisor_db}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RDS_BASE_URL: ${RDS_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
        NEXT_PUBLIC_DEMO_DEFAULT_PASSWORD: ${NEXT_PUBLIC_DEMO_DEFAULT_PASSWORD:-SmartAdvisor2025!}
    container_name: smartadvisor-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: smartadvisor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
