name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (API & RDS Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            services/api/package-lock.json
            services/rds-worker/package-lock.json

      - name: Typecheck, Test & Build API Service
        working-directory: services/api
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Typecheck, Test & Build RDS Worker
        working-directory: services/rds-worker
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  web-ci:
    name: Web App CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web application
        working-directory: apps/web
        run: npm run typecheck

      - name: Run web unit tests
        working-directory: apps/web
        run: npm test

      - name: Lint web application
        working-directory: apps/web
        run: npm run lint

      - name: Build web application
        working-directory: apps/web
        run: npm run build

  mobile-ci:
    name: Mobile App CI (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter codebase
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

  docker-smoke-test:
    name: Docker & NGINX Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f infrastructure/docker-compose.yml config

      - name: Validate NGINX Configuration Syntax
        run: |
          docker run --rm \
            --add-host=api:127.0.0.1 \
            --add-host=web:127.0.0.1 \
            -v "${{ github.workspace }}/infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Build API Docker Image
        run: docker build -t smartadvisor-api:smoke -f services/api/Dockerfile services/api

      - name: Build RDS Worker Docker Image
        run: docker build -t smartadvisor-rds-worker:smoke -f services/rds-worker/Dockerfile services/rds-worker

      - name: Build Web Docker Image
        run: docker build -t smartadvisor-web:smoke -f apps/web/Dockerfile apps/web

  security-load-ci:
    name: Security Pen-Test & Load Concurrency CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Build API Service
        working-directory: services/api
        run: |
          npm ci
          npm run build

      - name: Run Security Penetration Test Suite
        run: node tests/security/pentest.mjs

      - name: Run 10k Load & ACID Race Stress Suite
        run: node tests/load/load-test.mjs

  e2e-playwright-ci:
    name: Playwright E2E Verification CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            services/api/package-lock.json
            apps/web/package-lock.json
            e2e/package-lock.json

      - name: Install & Build API Service
        working-directory: services/api
        run: |
          npm ci
          npm run build

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install E2E Dependencies & Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck & Run Playwright E2E Suite
        working-directory: e2e
        run: |
          npm run typecheck
          npm test

      - name: Upload Playwright Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
